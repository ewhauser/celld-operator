# Disposable kind integration suites. They need Docker, a three-node kind
# cluster, registry access and 20-45 minutes each. Every pull request runs the
# lifecycle suite; the full matrix runs nightly, on demand, and on a pull request
# carrying the `integration` label.
name: Integration

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run (all, lifecycle, maintenance, faults, external, extended)
        default: all
        type: choice
        options: [all, lifecycle, maintenance, faults, external, extended]
  pull_request:
    types: [opened, labeled, synchronize, reopened]

permissions: {}

concurrency:
  group: integration-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    name: kind (${{ matrix.suite }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [lifecycle, maintenance, faults, external, extended]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Select suite
        id: select
        env:
          SUITE: ${{ matrix.suite }}
          EVENT: ${{ github.event_name }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'integration') }}
          INPUT: ${{ github.event.inputs.suite || 'all' }}
        run: |
          # A pull request runs lifecycle unless it carries the integration label;
          # schedule and dispatch honour the requested suite.
          if [ "$EVENT" = pull_request ] && [ "$LABELLED" != true ]; then
            REQUESTED=lifecycle
          else
            REQUESTED="$INPUT"
          fi
          case "$REQUESTED" in
            all|lifecycle|maintenance|faults|external|extended) ;;
            *) echo "Unknown integration suite: $REQUESTED" >&2; exit 1 ;;
          esac
          if [ "$REQUESTED" != all ] && [ "$REQUESTED" != "$SUITE" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        if: steps.select.outputs.run == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - run: python3 hack/install-ci-tools.py kind kubectl
        if: steps.select.outputs.run == 'true'
      - name: Raise inotify limits for three kubelets
        if: steps.select.outputs.run == 'true'
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=1024
          sudo sysctl -w fs.inotify.max_user_watches=1048576
      - name: Run suite
        if: steps.select.outputs.run == 'true'
        env:
          SUITE: ${{ matrix.suite }}
        run: make "integration-$SUITE"

name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.2.4
      - run: |
          python3 -m venv .qualification-venv
          .qualification-venv/bin/pip install -r hack/chart-requirements.txt -r hack/qualification/requirements.txt
          make check manifests-check qualification-replay qualification-test chart-check
      - name: Validate release version and packaging
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python3 hack/package-release.py --version "$RELEASE_VERSION" --image ghcr.io/ewhauser/celld-operator --digest sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Launcher and controller tests on both Linux architectures
        # The launcher's lock inheritance and PID 1 behavior are Linux-specific and
        # arch-independent only in principle; run the real suites under each arch
        # inside the pinned runtime image, which supplies /bin/sh for the fixtures.
        run: |
          set -euo pipefail
          # Docker's classic image store cannot hold two platforms of one digest
          # reference at once ("cannot overwrite digest"), so address each platform
          # of the pinned celld index by its own manifest digest.
          index=ghcr.io/denoland/celld@sha256:df8e74bb9a059df5779644368984933eba76acd6a2d196672732f4368f760fc8
          native="$(dpkg --print-architecture)"
          for arch in amd64 arm64; do
            manifest="$(docker buildx imagetools inspect "$index" --raw | jq -r --arg a "$arch" '.manifests[] | select(.platform.os=="linux" and .platform.architecture==$a) | .digest')"
            test -n "$manifest"
            # Signal-disposition fixtures are not reproducible under user-mode QEMU;
            # the emulated architecture skips exactly those tests and says so.
            emulated=()
            if [ "$arch" != "$native" ]; then emulated=(-e LAUNCHER_TESTS_EMULATED=1); fi
            for pkg in launcher controller; do
              CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go test -c -o "bin/tests/${pkg}-${arch}.test" "./internal/${pkg}"
              # pipefail carries the test binary's exit status through the filter.
              docker run --rm --platform "linux/${arch}" "${emulated[@]}" \
                -v "$PWD/bin/tests:/t:ro" -v "$PWD:/src:ro" -w "/src/internal/${pkg}" \
                --entrypoint "/t/${pkg}-${arch}.test" \
                "ghcr.io/denoland/celld@${manifest}" -test.count=1 -test.v 2>&1 | grep -E "^(--- (FAIL|SKIP)|FAIL|ok|PASS)"
            done
          done
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.repository.outputs.image }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.2.4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse existing or partially published version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
        run: python3 hack/check-release-absent.py
      - name: Resolve image repository
        id: repository
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.repository.outputs.image }}:${{ github.ref_name }}
          build-args: VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Smoke test the published image on both architectures
        # A multi-arch manifest proves nothing about either binary. Run each platform
        # of the exact pushed digest: version banner and the launcher install path.
        env:
          IMAGE: ${{ steps.repository.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > index.json
          for arch in amd64 arm64; do
            # Per-platform manifest digests: the classic image store refuses a
            # second platform under the same index digest reference.
            manifest="$(jq -r --arg a "$arch" '.manifests[] | select(.platform.os=="linux" and .platform.architecture==$a) | .digest' index.json)"
            test -n "$manifest"
            version="$(docker run --rm --platform "linux/${arch}" "$IMAGE@$manifest" --version)"
            test "$version" = "$RELEASE_VERSION"
            docker run --rm --platform "linux/${arch}" --entrypoint /celld-launcher "$IMAGE@$manifest" install /home/nonroot/launcher/celld-launcher
          done
  # The pushed digest, not a rebuild, must pass the in-cluster kind suite before
  # any chart or GitHub release points at it. A failure here leaves a tagged
  # image with no chart or release; the version is then burned by policy.
  qualify:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
          version: v0.33.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          sudo sysctl -w fs.inotify.max_user_instances=1024
          sudo sysctl -w fs.inotify.max_user_watches=1048576
      - name: Run the persistent lifecycle suite against the published image
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          go run ./hack/integration --persistent-lifecycle --operator-image "$IMAGE@$DIGEST"

  release:
    needs: [publish, qualify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.2.4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable chart and experimental release artifacts
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 hack/package-release.py --version "$RELEASE_VERSION" --image "$IMAGE" --digest "$DIGEST"
          version="${RELEASE_VERSION#v}"
          owner="${REPOSITORY%%/*}"
          owner="${owner,,}"
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GH_USER" --password-stdin
          helm push "dist/celld-operator-${version}.tgz" "oci://ghcr.io/${owner}/charts" | tee dist/helm-push.txt
          chart_digest="$(sed -n 's/^Digest: //p' dist/helm-push.txt)"
          test -n "$chart_digest"
          mkdir -p dist/verified
          helm pull "oci://ghcr.io/${owner}/charts/celld-operator" --version "$version" --destination dist/verified
          cmp "dist/celld-operator-${version}.tgz" "dist/verified/celld-operator-${version}.tgz"
          # Keyless signatures bind the artifacts to this workflow run's OIDC identity.
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign sign --yes "ghcr.io/${owner}/charts/celld-operator@${chart_digest}"
          cp config/crd/*.yaml dist/
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > dist/image.txt
          printf 'ghcr.io/%s/charts/celld-operator@%s\n' "$owner" "$chart_digest" > dist/chart.txt
          journal="$(grep -o 'j.Version = [0-9]*' internal/controller/lifecycle.go | grep -o '[0-9]*$')"
          (cd dist && sha256sum ./*.tgz ./*.yaml image.txt chart.txt > SHA256SUMS)
          cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
          cat > dist/notes.md <<EOF
          Experimental operator release. See docs/operations.md for installation, verification and qualification limits; local kind suites, including the one this release's image passed, do not establish AWS/EKS qualification.

          - Image: \`$IMAGE@$DIGEST\` (linux/amd64, linux/arm64), signed keyless by this workflow run.
          - Chart: \`ghcr.io/$owner/charts/celld-operator:$version\` (digest in chart.txt), signed keyless.
          - Lifecycle journal version: $journal. Operators older than the first release writing this version cannot read fleets touched by this one; downgrading is unsupported.
          - CRD upgrades are explicit: apply the bundled CRDs before upgrading the chart. Retained data and storage reservations must never be deleted on uninstall.

          Verify: \`cosign verify --certificate-identity-regexp 'https://github.com/$REPOSITORY/' --certificate-oidc-issuer https://token.actions.githubusercontent.com $IMAGE@$DIGEST\`
          EOF
          gh release create "$RELEASE_VERSION" dist/*.tgz dist/*.yaml dist/image.txt dist/chart.txt dist/SHA256SUMS dist/SHA256SUMS.sigstore.json --verify-tag --prerelease --title "$RELEASE_VERSION (experimental)" --notes-file dist/notes.md

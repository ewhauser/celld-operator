# Generated by hack/sync-chart.py; edit config/rbac/fleet-namespace.yaml.
{{- range .Values.fleetNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{ . | quote }}
  name: {{ include "celld-operator.name" $ }}-fleet
rules:
  - apiGroups: [celld.eric.dev]
    resources: [celldfleets]
    verbs: [create, delete]
  - apiGroups: ['']
    resources: [serviceaccounts]
    verbs: [get]
  # Update applies only to filling unset fields a newer release declares on an
  # otherwise exactly matching operator-created Service, pinned to its resourceVersion.
  - apiGroups: ['']
    resources: [services]
    verbs: [get, create, update]
  # Delete removes a member's original claim, bound to its UID and version,
  # after its Pod deletion commits, and every claim once a deleted fleet's
  # StatefulSet is gone. The StatefulSet creates claims.
  - apiGroups: ['']
    resources: [persistentvolumeclaims]
    verbs: [get, list, delete]
  # Update releases the zone scheduling gate of Ordered Bucket Pods and manages
  # a PersistentFleet replacement's handoff record, index label and finalizer.
  # Delete commits that replacement and force-deletes a Pod on a lost node.
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, update, delete]
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, create]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, create, update, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, create, update, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, create, update, delete]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, create, update, delete]
  # Fleets in the Istio mesh (spec.mesh.istio) get an AuthorizationPolicy, and a
  # PeerAuthentication while members roll into or out of the mesh, owned by
  # the CelldFleet. Delete removes them once a fleet has rolled out of the mesh.
  - apiGroups: [security.istio.io]
    resources: [authorizationpolicies, peerauthentications]
    verbs: [get, create, update, delete]
  # Update converges fleet budgets.
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, create, update]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: {{ . | quote }}
  name: {{ include "celld-operator.name" $ }}-fleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "celld-operator.name" $ }}-fleet
subjects:
  - kind: ServiceAccount
    name: {{ include "celld-operator.name" $ }}
    namespace: {{ $.Release.Namespace | quote }}
{{- end }}

# Generated by hack/sync-chart.py; edit config/rbac/fleet-namespace.yaml.
{{- range .Values.fleetNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{ . | quote }}
  name: {{ include "celld-operator.name" $ }}-fleet
rules:
  - apiGroups: ['']
    resources: [serviceaccounts]
    verbs: [get]
  - apiGroups: ['']
    resources: [services]
    verbs: [get, create]
  # list covers the single retained-claim inventory the lifecycle reads per reconcile.
  - apiGroups: ['']
    resources: [persistentvolumeclaims]
    verbs: [get, list, create]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, update, delete]
  - apiGroups: ['']
    resources: [secrets, configmaps]
    verbs: [get, create]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, create, update, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, create]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, create]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: {{ . | quote }}
  name: {{ include "celld-operator.name" $ }}-fleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "celld-operator.name" $ }}-fleet
subjects:
  - kind: ServiceAccount
    name: {{ include "celld-operator.name" $ }}
    namespace: {{ $.Release.Namespace | quote }}
{{- end }}

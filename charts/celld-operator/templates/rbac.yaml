# Generated by hack/sync-chart.py; edit config/manager/operator.yaml.
# Cluster-wide privileges cover only the fleet API and cluster-scoped storage
# and node objects. Everything the operator touches inside a fleet namespace
# (workloads, pods, claims, secrets, journal archives, policies) is granted per
# namespace by config/rbac/fleet-namespace.yaml. A fleet in a namespace without
# that Role is reported as NamespaceAccessDenied rather than reconciled.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "celld-operator.name" . }}
rules:
  - apiGroups: [celld.eric.dev]
    resources: [celldfleets]
    verbs: [get, list, watch, patch]
  - apiGroups: [celld.eric.dev]
    resources: [celldfleets/status]
    verbs: [get, patch]
  - apiGroups: [celld.eric.dev]
    resources: [celldstoragereservations]
    verbs: [get, create, update]
  - apiGroups: ['']
    resources: [persistentvolumes]
    verbs: [get]
  - apiGroups: ['']
    resources: [nodes]
    verbs: [get]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "celld-operator.name" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "celld-operator.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "celld-operator.name" . }}
    namespace: {{ .Release.Namespace | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "celld-operator.name" . }}-leader
  namespace: {{ .Release.Namespace | quote }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: ['']
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "celld-operator.name" . }}-leader
  namespace: {{ .Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "celld-operator.name" . }}-leader
subjects:
  - kind: ServiceAccount
    name: {{ include "celld-operator.name" . }}
    namespace: {{ .Release.Namespace | quote }}

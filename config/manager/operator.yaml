apiVersion: v1
kind: Namespace
metadata:
  name: celld-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: celld-operator
  namespace: celld-system
---
# Cluster-wide privileges cover only the fleet API and cluster-scoped storage
# and node objects. Everything the operator touches inside a fleet namespace
# (workloads, pods, claims, secrets, policies) is granted per
# namespace by config/rbac/fleet-namespace.yaml. A fleet in a namespace without
# that Role is reported as NamespaceAccessDenied rather than reconciled.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: celld-operator
rules:
  - apiGroups: [celld.eric.dev]
    resources: [celldfleets]
    verbs: [get, list, watch, patch]
  - apiGroups: [celld.eric.dev]
    resources: [celldpreviews]
    verbs: [get, list, watch, patch]
  - apiGroups: [celld.eric.dev]
    resources: [celldpreviewpools, celldpreviewseeds]
    verbs: [get, list, watch]
  - apiGroups: [celld.eric.dev]
    resources: [celldpreviews/status]
    verbs: [get, patch]
  - apiGroups: [celld.eric.dev]
    resources: [celldfleets/status]
    verbs: [get, patch]
  - apiGroups: [celld.eric.dev]
    resources: [celldstoragereservations]
    verbs: [get, create, update]
  - apiGroups: ['']
    resources: [persistentvolumes]
    verbs: [get]
  - apiGroups: ['']
    resources: [nodes]
    verbs: [get]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get]
  - apiGroups: [storage.k8s.io]
    resources: [volumeattachments]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: celld-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: celld-operator
subjects:
  - kind: ServiceAccount
    name: celld-operator
    namespace: celld-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: celld-leader-election
  namespace: celld-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: ['']
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: celld-leader-election
  namespace: celld-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: celld-leader-election
subjects:
  - kind: ServiceAccount
    name: celld-operator
    namespace: celld-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celld-operator
  namespace: celld-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: celld-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celld-operator
    spec:
      serviceAccountName: celld-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghcr.io/ewhauser/celld-operator:dev
          args: [--operator-namespace=celld-system]
          ports:
            - name: health
              containerPort: 8082
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi

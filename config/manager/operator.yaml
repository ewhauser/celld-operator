apiVersion: v1
kind: Namespace
metadata:
  name: celld-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: celld-operator
  namespace: celld-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: celld-operator
rules:
  - apiGroups: [celld.example.com]
    resources: [celldfleets]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [celld.example.com]
    resources: [celldfleets/status]
    verbs: [get, patch, update]
  - apiGroups: [celld.example.com]
    resources: [celldstoragereservations]
    verbs: [get, create, update]
  - apiGroups: ['']
    resources: [serviceaccounts]
    verbs: [get]
  - apiGroups: ['']
    resources: [services, persistentvolumeclaims]
    verbs: [get, create]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, create, update]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, create]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, create]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get]
  - apiGroups: ['']
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: celld-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: celld-operator
subjects:
  - kind: ServiceAccount
    name: celld-operator
    namespace: celld-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: celld-leader-election
  namespace: celld-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: celld-leader-election
  namespace: celld-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: celld-leader-election
subjects:
  - kind: ServiceAccount
    name: celld-operator
    namespace: celld-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celld-operator
  namespace: celld-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: celld-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celld-operator
    spec:
      serviceAccountName: celld-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghcr.io/ewhauser/celld-operator:dev
          args: [--operator-namespace=celld-system]
          ports:
            - name: health
              containerPort: 8082
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi

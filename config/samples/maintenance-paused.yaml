apiVersion: celld.eric.dev/v1alpha1
kind: CelldFleet
metadata:
  name: maintenance-example
  namespace: fleets
spec:
  qualification: Experimental
  profile: PersistentFleet
  replicas: 3
  maintenance:
    paused: true
    # Change restartToken to request a same-version restart after unpausing.
    # Strict placement must remain valid; small PersistentFleets need explicit downtime.
    # restartToken: maintenance-2026-09
  # Set runtimeImage to an independently qualified ghcr.io/ewhauser/celld digest.
  # There is no default compatible pin; omission blocks provisioning.
  serviceAccountName: runtime
  storage:
    bucket: replace-with-dedicated-bucket
    region: us-east-1
    storageClassName: ebs-delete
  placement:
    azCount: 3
    zones: [us-east-1a, us-east-1b, us-east-1c]

# Optional disposable shared store. Adapt capacity and placement to your cluster.
# A lost Pod loses ALL preview data; use an existing retained store when needed.
# Pre-create Secret preview-store with accessKeyId and secretAccessKey keys.
# Create the shared-previews bucket before creating previews (see docs/previews.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: preview-runtime
  namespace: previews
---
apiVersion: v1
kind: Service
metadata:
  name: preview-store
  namespace: previews
spec:
  selector:
    app.kubernetes.io/name: preview-store
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-store
  namespace: previews
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: preview-store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: preview-store
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
          args: [server, /data, --address, ':9000']
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: preview-store
                  key: accessKeyId
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: preview-store
                  key: secretAccessKey
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 1Gi
            limits:
              memory: 1Gi
              ephemeral-storage: 10Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 10Gi
---
# Runtime and in-cluster CI clients need this namespace and label.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: preview-store
  namespace: previews
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: preview-store
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: celld.eric.dev/fleet-uid
                operator: Exists
        - podSelector:
            matchLabels:
              celld.eric.dev/preview-uploader: 'true'
      ports:
        - protocol: TCP
          port: 9000

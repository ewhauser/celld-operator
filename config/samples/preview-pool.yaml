# Platform-owned: shared configuration and object storage, one small runtime per preview.
# Create the namespace, bucket, Secret, ServiceAccount and wildcard DNS/TLS first.
apiVersion: celld.eric.dev/v1alpha1
kind: CelldPreviewPool
metadata:
  name: shared-previews
  namespace: previews
spec:
  runtimeImage: ghcr.io/ewhauser/celld@sha256:4b9eb5656054580e7dd5ed2bbd9ee8b641ecd60c317437e9be63f4e3ae333f29
  serviceAccountName: preview-runtime
  zone: us-east-1a
  storage:
    bucket: shared-previews
    region: us-east-1
    # Omit endpoint to use AWS S3 with the ServiceAccount's identity.
    endpoint:
      url: http://preview-store.previews.svc:9000
      credentialsSecretName: preview-store
      egress:
        namespace: previews
        podLabels:
          app.kubernetes.io/name: preview-store
  routing:
    baseDomain: previews.example.com
    scheme: https
    ingress:
      className: nginx
      tlsSecretName: previews-wildcard-tls
    source:
      namespace: ingress-nginx
      podLabels:
        app.kubernetes.io/component: controller
  # Defaults shown for capacity planning; these sections may be omitted.
  execution:
    cpuRequest: 25m
    memoryRequest: 64Mi
    memoryLimit: 256Mi
    maxResidentCells: 8
    idleEvictSeconds: 30
  scratch:
    request: 64Mi
    limit: 512Mi

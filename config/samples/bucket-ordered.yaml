apiVersion: celld.eric.dev/v1alpha1
kind: CelldFleet
metadata:
  name: ordered-bucket-example
  namespace: default
spec:
  profile: Bucket
  bucketWorkload: Ordered
  replicas: 3
  serviceAccountName: celld-runtime
  storage:
    bucket: replace-with-dedicated-bucket
    region: us-east-1
    sizeGiB: 10
  placement:
    azCount: 2
    zones: [us-east-1a, us-east-1b]

apiVersion: celld.eric.dev/v1alpha1
kind: CelldFleet
metadata:
  name: export-bucket-example
  namespace: fleets
spec:
  profile: Bucket
  replicas: 3
  # Replace with a fork release that ships change export; none does yet.
  runtimeImage: ghcr.io/ewhauser/celld@sha256:1c0d854cd2af39fa439f163d5b88a19c7bccefd25fe35e2c0e1f43b3d886f424
  serviceAccountName: runtime
  storage:
    bucket: replace-with-dedicated-bucket
    region: us-east-1
    sizeGiB: 10
  placement:
    azCount: 3
    zones: [us-east-1a, us-east-1b, us-east-1c]
  export:
    sink: Bucket
    classes: [Cart, Order]
    excludeTables: [Cart.audit_log]
    bucket:
      # Optional; the runtime ServiceAccount must be able to write it.
      name: replace-with-export-bucket
      flushMilliseconds: 10000
      retentionDays: 30

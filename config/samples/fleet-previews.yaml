# Existing application fleet with optional preview configuration.
# The preview bucket and credentials are separate from this fleet's own storage.
apiVersion: celld.eric.dev/v1alpha1
kind: CelldFleet
metadata:
  name: development
  namespace: previews
spec:
  runtimeImage: ghcr.io/ewhauser/celld@sha256:1c0d854cd2af39fa439f163d5b88a19c7bccefd25fe35e2c0e1f43b3d886f424
  profile: Bucket
  replicas: 1
  serviceAccountName: celld-runtime
  storage:
    bucket: development-application
    region: us-east-1
    sizeGiB: 10
  placement:
    azCount: 1
    zones: [us-east-1a]
    mode: Relaxed
  previews:
    runtimeImage: ghcr.io/ewhauser/celld@sha256:1c0d854cd2af39fa439f163d5b88a19c7bccefd25fe35e2c0e1f43b3d886f424
    serviceAccountName: preview-runtime
    zone: us-east-1a
    storage:
      bucket: shared-previews
      region: us-east-1
      # Omit endpoint to use AWS S3 with the ServiceAccount's identity.
      endpoint:
        url: http://preview-store.previews.svc:9000
        credentialsSecretName: preview-store
        egress:
          namespace: previews
          podLabels:
            app.kubernetes.io/name: preview-store
    routing:
      baseDomain: previews.example.com
      scheme: https
      ingress:
        className: nginx
        tlsSecretName: previews-wildcard-tls
      source:
        namespace: ingress-nginx
        podLabels:
          app.kubernetes.io/component: controller
    # Defaults shown for capacity planning; these sections may be omitted.
    execution:
      cpuRequest: 25m
      memoryRequest: 64Mi
      memoryLimit: 256Mi
      maxResidentCells: 8
      idleEvictSeconds: 30
    scratch:
      request: 64Mi
      limit: 512Mi

apiVersion: celld.eric.dev/v1alpha1
kind: CelldFleet
metadata:
  name: export-kafka-example
  namespace: fleets
spec:
  profile: Bucket
  replicas: 3
  # v0.6.1-ewhauser.3 Kafka variant, built with export-kafka.
  runtimeImage: ghcr.io/ewhauser/celld@sha256:d880dae9f8e14d55740fbcf361d01e32cefca113b631a6e9cf99f5f1f1edbc4e
  serviceAccountName: runtime
  storage:
    bucket: replace-with-dedicated-bucket
    region: us-east-1
    sizeGiB: 10
  placement:
    azCount: 3
    zones: [us-east-1a, us-east-1b, us-east-1c]
  execution:
    # Room for the default 256 MiB export queue.
    memoryLimit: 2Gi
  export:
    sink: Kafka
    classes: [Cart, Order]
    kafka:
      brokers:
        - kafka-0.kafka.kafka.svc:9092
        - kafka-1.kafka.kafka.svc:9092
        - kafka-2.kafka.kafka.svc:9092
      # Create it first, with max.message.bytes >= 1114112.
      topic: celld-changes
      retryMilliseconds: 30000
      # librdkafka settings, one name=value per line. Every key of the
      # Secret is mounted under /etc/celld/export, so it can carry the CA:
      #   security.protocol=SASL_SSL
      #   sasl.mechanisms=SCRAM-SHA-512
      #   sasl.username=celld
      #   sasl.password=...
      #   ssl.ca.location=/etc/celld/export/ca.crt
      propertiesSecretKeyRef:
        name: kafka-client
        key: kafka.properties
      egress:
        podLabels:
          app.kubernetes.io/name: kafka
        namespace: kafka

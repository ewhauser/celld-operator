# Apply in every namespace that will hold CelldFleet resources:
#   kubectl --context YOUR_EXPLICIT_CONTEXT -n FLEET_NAMESPACE apply -f config/rbac/fleet-namespace.yaml
# The operator's cluster-wide role covers only the fleet API and cluster-scoped
# storage/node objects. These namespaced verbs are the complete set the
# controller uses inside a fleet namespace; nothing here is cluster-wide.
# Adjust the subject namespace if the operator is installed elsewhere.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: celld-fleet-operator
rules:
  - apiGroups: [celld.eric.dev]
    resources: [celldfleets]
    verbs: [create, delete]
  - apiGroups: ['']
    resources: [serviceaccounts]
    verbs: [get]
  # Update applies only to filling unset fields a newer release declares on an
  # otherwise exactly matching operator-created Service, pinned to its resourceVersion.
  - apiGroups: ['']
    resources: [services]
    verbs: [get, create, update]
  # Delete applies only to exact UID/RV-bound claims after captured strict removal proof.
  - apiGroups: ['']
    resources: [persistentvolumeclaims]
    verbs: [get, list, create, delete]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, update, delete]
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, create]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, create, update, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, create, update, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, create, update, delete]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, create, update, delete]
  # Update converges Bucket fleet budgets (ADR 0023); PersistentFleet budgets
  # remain verify-only.
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, create, update]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: celld-fleet-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: celld-fleet-operator
subjects:
  - kind: ServiceAccount
    name: celld-operator
    namespace: celld-system

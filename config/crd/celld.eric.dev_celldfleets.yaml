---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: celldfleets.celld.eric.dev
spec:
  group: celld.eric.dev
  names:
    kind: CelldFleet
    listKind: CelldFleetList
    plural: celldfleets
    shortNames:
    - cf
    singular: celldfleet
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CelldFleet supports journaled capacity and maintenance requests.
          No scale subresource is exposed.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              bucketWorkload:
                default: Deployment
                description: Bucket workload layout. Defaults to Deployment; Ordered
                  uses deterministic ordinal removal. Existing fleets require an explicit
                  migration token and downtime permission to change to Ordered.
                enum:
                - Deployment
                - Ordered
                type: string
              capacity:
                description: Optional policy; omission keeps manual ownership.
                properties:
                  cpuHighMillicores:
                    default: 200
                    description: Absolute per-container CPU threshold for high demand,
                      in millicores; not a percentage of resource requests.
                    format: int32
                    maximum: 1000000
                    minimum: 1
                    type: integer
                  cpuLowMillicores:
                    default: 80
                    description: Absolute per-container CPU threshold for low demand,
                      in millicores.
                    format: int32
                    maximum: 1000000
                    minimum: 1
                    type: integer
                  maxAgeSeconds:
                    default: 45
                    description: Maximum allowed observation age and gap between observations.
                    format: int32
                    maximum: 600
                    minimum: 10
                    type: integer
                  maxReplicas:
                    default: 10
                    description: Policy ceiling for automatic additions. Manual overrides
                      can exceed policy bounds.
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  maxWindowSeconds:
                    default: 60
                    description: Maximum accepted Metrics Server CPU averaging window.
                    format: int32
                    maximum: 300
                    minimum: 5
                    type: integer
                  memoryHighMiB:
                    default: 768
                    description: Per-container Metrics Server memory threshold for
                      high demand, in MiB.
                    format: int32
                    maximum: 1048576
                    minimum: 1
                    type: integer
                  memoryLowMiB:
                    default: 384
                    description: Per-container Metrics Server memory threshold for
                      low demand, in MiB.
                    format: int32
                    maximum: 1048576
                    minimum: 1
                    type: integer
                  minReplicas:
                    default: 3
                    description: Policy replica floor; must cover every configured
                      availability zone. Manual overrides can exceed policy bounds.
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  minSamples:
                    default: 3
                    description: Distinct advancing observations required in a stabilization
                      window.
                    format: int32
                    maximum: 100
                    minimum: 2
                    type: integer
                  minWindowSeconds:
                    default: 5
                    description: Minimum accepted Metrics Server CPU averaging window.
                    format: int32
                    maximum: 60
                    minimum: 1
                    type: integer
                  mode:
                    default: Shadow
                    description: |-
                      Shadow reports recommendations only. ScaleOut permits bounded additions. Automatic also requests removals, which remain disabled against production evidence.
                      External hands spec.replicas to one /scale writer (typically an HPA); the
                      built-in policy computes nothing and the other policy fields are ignored.
                    enum:
                    - Shadow
                    - ScaleOut
                    - Automatic
                    - External
                    type: string
                  provisioningTimeoutSeconds:
                    default: 600
                    description: Time allowed for requested capacity to become useful
                      before further additions are held.
                    format: int32
                    maximum: 86400
                    minimum: 60
                    type: integer
                  redistributionObservationSeconds:
                    default: 120
                    description: Continuous complete observation after an addition
                      before judging redistribution.
                    format: int32
                    maximum: 3600
                    minimum: 30
                    type: integer
                  sampleIntervalSeconds:
                    default: 15
                    description: Minimum interval between counted observations.
                    format: int32
                    maximum: 300
                    minimum: 5
                    type: integer
                  scaleInCooldownSeconds:
                    default: 900
                    description: Minimum wait after a durable action before an automatic
                      removal request.
                    format: int32
                    maximum: 86400
                    minimum: 60
                    type: integer
                  scaleInStabilizationSeconds:
                    default: 600
                    description: Continuous low-demand duration required before a
                      policy removal recommendation.
                    format: int32
                    maximum: 86400
                    minimum: 60
                    type: integer
                  scaleOutCooldownSeconds:
                    default: 300
                    description: Minimum wait after a durable action before another
                      automatic addition.
                    format: int32
                    maximum: 86400
                    minimum: 30
                    type: integer
                  scaleOutStabilizationSeconds:
                    default: 30
                    description: Continuous high-demand duration required before a
                      policy addition.
                    format: int32
                    maximum: 3600
                    minimum: 10
                    type: integer
                  scaleOutStep:
                    default: 1
                    description: Maximum replicas added in one completed stable policy
                      decision.
                    format: int32
                    maximum: 10
                    minimum: 1
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: invalid replica bounds
                  rule: self.minReplicas <= self.maxReplicas
                - message: low thresholds must be below high thresholds
                  rule: self.cpuLowMillicores < self.cpuHighMillicores && self.memoryLowMiB
                    < self.memoryHighMiB
                - message: invalid sampling windows
                  rule: self.minWindowSeconds <= self.maxWindowSeconds && self.sampleIntervalSeconds
                    <= self.maxAgeSeconds
              execution:
                description: |-
                  Per-fleet runtime sizing. Immutable after creation: the operator never rolls
                  out a changed pod template. Omitted fields keep the prototype constants.
                properties:
                  cpuLimit:
                    description: 'CPU limit for the celld container. Default: none.'
                    pattern: ^[0-9]+(\.[0-9]+)?m?$
                    type: string
                  cpuRequest:
                    description: CPU request for the celld container (Kubernetes quantity).
                      Default 250m.
                    pattern: ^[0-9]+(\.[0-9]+)?m?$
                    type: string
                  idleEvictSeconds:
                    description: |-
                      Seconds after which an idle resident cell hibernates (CELLD_IDLE_EVICT_S).
                      Unset leaves only pressure and the residency cap to evict idle cells.
                    format: int32
                    maximum: 86400
                    minimum: 1
                    type: integer
                  maxResidentCells:
                    description: |-
                      Hard resident-cell admission limit (CELLD_MAX_RESIDENT_CELLS). Unset leaves
                      the runtime default.
                    format: int32
                    maximum: 1000000
                    minimum: 1
                    type: integer
                  memoryLimit:
                    description: Memory limit for the celld container. Default 1Gi.
                    pattern: ^[0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|K|M|G|T)?$
                    type: string
                  memoryRequest:
                    description: Memory request for the celld container. Default 512Mi.
                    pattern: ^[0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|K|M|G|T)?$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: cpuLimit must be at least cpuRequest
                  rule: '!has(self.cpuLimit) || !has(self.cpuRequest) || quantity(self.cpuLimit).isGreaterThan(quantity(self.cpuRequest))
                    || quantity(self.cpuLimit).compareTo(quantity(self.cpuRequest))
                    == 0'
                - message: memoryLimit must be at least memoryRequest
                  rule: '!has(self.memoryLimit) || !has(self.memoryRequest) || quantity(self.memoryLimit).isGreaterThan(quantity(self.memoryRequest))
                    || quantity(self.memoryLimit).compareTo(quantity(self.memoryRequest))
                    == 0'
              lifecycle:
                description: Per-fleet shutdown and termination budgets. Immutable
                  after creation.
                properties:
                  shutdownSeconds:
                    description: celld total stop bound in seconds (CELLD_SHUTDOWN_TOTAL_MS).
                      Default 20.
                    format: int32
                    maximum: 3600
                    minimum: 1
                    type: integer
                  terminationGraceSeconds:
                    description: Pod terminationGracePeriodSeconds. Default 30. Must
                      exceed shutdownSeconds by 5.
                    format: int32
                    maximum: 3605
                    minimum: 6
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: terminationGraceSeconds must exceed shutdownSeconds by
                    at least 5
                  rule: '!has(self.shutdownSeconds) || !has(self.terminationGraceSeconds)
                    || self.shutdownSeconds + 5 <= self.terminationGraceSeconds'
                - message: shutdownSeconds above 25 requires an explicit terminationGraceSeconds
                  rule: '!has(self.shutdownSeconds) || has(self.terminationGraceSeconds)
                    || self.shutdownSeconds + 5 <= 30'
                - message: terminationGraceSeconds must be at least 25 with the default
                    20 second shutdown
                  rule: has(self.shutdownSeconds) || !has(self.terminationGraceSeconds)
                    || self.terminationGraceSeconds >= 25
              maintenance:
                description: Maintenance requests share the retained lifecycle journal.
                properties:
                  allowCoordinatedDowntime:
                    description: Explicitly permit an operation that stops the entire
                      fleet.
                    type: boolean
                  orderedMigrationToken:
                    description: 'Request one-way Deployment-to-Ordered migration
                      together with bucketWorkload: Ordered.'
                    maxLength: 128
                    type: string
                  paused:
                    description: Pause new actions and unissued operations; continue
                      recovery of issued actions.
                    type: boolean
                  restartToken:
                    description: Change to a new nonempty token to request a same-version
                      restart. Completed tokens are not replayed. Placement and verified
                      shutdown prerequisites must pass.
                    maxLength: 128
                    type: string
                type: object
              placement:
                description: Allowed availability zones and scheduling strictness.
                  Immutable after creation.
                properties:
                  azCount:
                    description: Number of availability zones; must equal the number
                      of entries in zones.
                    format: int32
                    maximum: 6
                    minimum: 1
                    type: integer
                  mode:
                    default: Strict
                    description: Strict requires zone balance and distinct hosts.
                      Relaxed makes spread and host separation preferences while retaining
                      the zone allowlist.
                    enum:
                    - Strict
                    - Relaxed
                    type: string
                  zones:
                    description: Explicit zone allowlist; no automatic reselection
                      when capacity changes.
                    items:
                      maxLength: 33
                      minLength: 1
                      type: string
                    maxItems: 6
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                required:
                - azCount
                - zones
                type: object
              profile:
                description: 'Storage profile: Bucket uses temporary local disk and
                  S3; PersistentFleet adds retained peer disks. Immutable after creation.'
                enum:
                - Bucket
                - PersistentFleet
                type: string
              qualification:
                description: A required acknowledgment of the qualification boundary;
                  production is unavailable.
                enum:
                - Experimental
                type: string
              replicas:
                default: 3
                description: Manual replica target. Capacity policy can choose a different
                  applied count without editing this field. Must cover every configured
                  availability zone.
                format: int32
                maximum: 100
                minimum: 1
                type: integer
              runtimeImage:
                description: |-
                  Requested immutable runtime digest. Omission selects the original v0.5.0 pin.
                  Unsupported transitions are durably blocked, including rollback.
                pattern: ^ghcr.io/denoland/celld@sha256:[a-f0-9]{64}$
                type: string
              serviceAccountName:
                description: Existing ServiceAccount in the fleet namespace with the
                  runtime bucket permissions. Immutable after creation.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                type: string
              storage:
                description: Dedicated bucket and local disk settings. Immutable after
                  creation.
                properties:
                  bucket:
                    description: Name of the dedicated S3 bucket. The operator permanently
                      reserves it for this fleet identity.
                    maxLength: 63
                    minLength: 3
                    pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
                    type: string
                  region:
                    description: AWS region containing the bucket and the configured
                      availability zones.
                    maxLength: 32
                    pattern: ^[a-z]{2}(-[a-z]+)+-[0-9]+$
                    type: string
                  sizeGiB:
                    default: 10
                    description: 'Disk space in GiB: PVC size for PersistentFleet,
                      disk-backed emptyDir limit for Bucket.'
                    format: int32
                    maximum: 16384
                    minimum: 1
                    type: integer
                  storageClassName:
                    description: Required only for PersistentFleet; must reference
                      an existing Retain/WaitForFirstConsumer class.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                    type: string
                required:
                - bucket
                - region
                type: object
            required:
            - placement
            - profile
            - qualification
            - serviceAccountName
            - storage
            type: object
            x-kubernetes-validations:
            - message: only replicas, capacity, runtimeImage, maintenance and an authorized
                Deployment-to-Ordered migration may change; execution and lifecycle
                tuning are fixed at creation
              rule: self.qualification == oldSelf.qualification && self.profile ==
                oldSelf.profile && self.serviceAccountName == oldSelf.serviceAccountName
                && self.storage == oldSelf.storage && self.placement == oldSelf.placement
                && has(self.execution) == has(oldSelf.execution) && (!has(self.execution)
                || self.execution == oldSelf.execution) && has(self.lifecycle) ==
                has(oldSelf.lifecycle) && (!has(self.lifecycle) || self.lifecycle
                == oldSelf.lifecycle) && (self.bucketWorkload == oldSelf.bucketWorkload
                || (oldSelf.bucketWorkload == 'Deployment' && self.bucketWorkload
                == 'Ordered' && has(self.maintenance) && has(self.maintenance.orderedMigrationToken)
                && size(self.maintenance.orderedMigrationToken) > 0 && has(self.maintenance.allowCoordinatedDowntime)
                && self.maintenance.allowCoordinatedDowntime))
            - message: Ordered bucketWorkload requires Bucket profile
              rule: self.bucketWorkload != 'Ordered' || self.profile == 'Bucket'
            - message: azCount must equal the zones count
              rule: self.placement.azCount == size(self.placement.zones)
            - message: replicas must be at least azCount
              rule: self.replicas >= self.placement.azCount
            - message: storageClassName is required only for PersistentFleet
              rule: 'self.profile == ''PersistentFleet'' ? has(self.storage.storageClassName)
                && size(self.storage.storageClassName) > 0 : !has(self.storage.storageClassName)'
            - message: zones must be standard AZ names in storage.region
              rule: self.placement.zones.all(z, z.startsWith(self.storage.region)
                && size(z) == size(self.storage.region) + 1 && z.matches('.*[a-z]$'))
            - message: capacity minimum must cover requested AZs
              rule: '!has(self.capacity) || self.capacity.minReplicas >= self.placement.azCount'
          status:
            properties:
              appliedReplicas:
                description: Replica target currently applied to the owned Kubernetes
                  workload.
                format: int32
                type: integer
              blockedSince:
                description: RFC3339 time when the fleet entered its current continuous
                  Blocked state; empty when not blocked.
                type: string
              capacity:
                description: Latest capacity policy recommendation and observation
                  coverage.
                properties:
                  coveredReplicas:
                    description: Expected replicas covered by the current capacity
                      observations.
                    format: int32
                    type: integer
                  desiredReplicas:
                    description: Recommended count; informational in Shadow mode and
                      not necessarily the applied workload count.
                    format: int32
                    type: integer
                  message:
                    description: Human-readable explanation of the latest recommendation
                      or hold.
                    type: string
                  mode:
                    description: Current capacity policy mode.
                    type: string
                  pendingReplicas:
                    description: Capacity requested but not yet observed as useful.
                    format: int32
                    type: integer
                  reason:
                    description: Machine-readable explanation of the latest recommendation
                      or hold.
                    type: string
                  usefulReplicas:
                    description: Observed replicas considered ready and useful by
                      the capacity policy.
                    format: int32
                    type: integer
                type: object
              conditions:
                description: Current readiness, progress, blocked, maintenance, and
                  experimental-validation conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              desiredReplicas:
                description: Current operation or enabled policy target, otherwise
                  spec.replicas; zero during deletion.
                format: int32
                type: integer
              joiningReplicas:
                description: Observed non-terminating Pods that are not ready yet.
                format: int32
                type: integer
              labelSelector:
                description: Serialized selector for exactly this fleet's Pods, for
                  the /scale subresource.
                type: string
              lifecycle:
                description: Progress and retained findings for capacity and maintenance
                  operations.
                properties:
                  deadline:
                    description: RFC3339 operation deadline. Passing it reports a
                      stall; it does not cancel recovery.
                    type: string
                  evidenceBlocker:
                    description: Reason the most recent recovery metadata assessment
                      could not establish the required state.
                    type: string
                  evidenceCheckedAt:
                    description: RFC3339 time of the most recent recorded recovery
                      metadata assessment.
                    type: string
                  from:
                    description: Starting replica count of the active capacity operation.
                    format: int32
                    type: integer
                  lastCompletionAt:
                    description: RFC3339 evidence time of the most recent lifecycle
                      history entry, when available.
                    type: string
                  lastOutcome:
                    description: Outcome recorded in the most recent lifecycle history
                      entry.
                    type: string
                  operationID:
                    description: Identifier of the active capacity or maintenance
                      operation.
                    type: string
                  phase:
                    description: Current phase of the active operation; use the condition
                      message for the next action.
                    type: string
                  possibleLoss:
                    description: Retained runtime data-loss finding. Preserve storage
                      and recovery records and investigate; editing status does not
                      clear it.
                    type: string
                  requestID:
                    description: Identifier or token of the retained request.
                    type: string
                  requestKind:
                    description: Kind of a retained maintenance or runtime-transition
                      request.
                    type: string
                  retiredBucketSessions:
                    description: RetiredBucketSessions left logical membership; physical
                      liveness is unknown.
                    format: int32
                    type: integer
                  sessionCount:
                    description: Number of runtime sessions in the most recent recorded
                      evidence inventory.
                    format: int32
                    type: integer
                  stalled:
                    description: Whether the active operation has exceeded its persisted
                      deadline.
                    type: boolean
                  startedAt:
                    description: RFC3339 start time of the active operation, when
                      available.
                    type: string
                  targetGeneration:
                    description: Runtime session generation of the selected target.
                    type: string
                  targetImage:
                    description: Requested runtime image of a retained transition
                      request.
                    type: string
                  targetPod:
                    description: Pod selected for the active capacity operation, when
                      applicable.
                    type: string
                  targetUID:
                    description: Exact Kubernetes UID of the selected target Pod.
                    type: string
                  to:
                    description: Target replica count of the active capacity operation.
                    format: int32
                    type: integer
                type: object
              observedGeneration:
                description: Fleet metadata.generation reflected by this status update.
                format: int64
                type: integer
              observedReplicas:
                description: Number of owned Pods observed in the latest complete
                  inventory, including terminating Pods.
                format: int32
                type: integer
              readyReplicas:
                description: Ready count from the owned workload status, provided
                  it covers the current workload generation.
                format: int32
                type: integer
              replicaObservationValid:
                description: Whether the Pod inventory was complete. False means counts
                  must not be interpreted as proof of no running processes.
                type: boolean
              replicas:
                description: |-
                  Replicas and LabelSelector serve the /scale subresource: non-terminal pods
                  of this fleet, including terminating ones, and the selector that matches
                  exactly them. They never express permission to scale.
                  Zero is serialized so the scale view always carries a count, but the schema
                  does not require it: a status written before this field existed stays valid.
                format: int32
                type: integer
              reservation:
                description: Name of the cluster-scoped storage reservation holding
                  this fleet's recovery records.
                type: string
              terminatingReplicas:
                description: Observed Pods with a deletion timestamp.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: fleet name must be a DNS label of at most 40 characters
          rule: size(self.metadata.name) <= 40 && self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    served: true
    storage: true
    subresources:
      scale:
        labelSelectorPath: .status.labelSelector
        specReplicasPath: .spec.replicas
        statusReplicasPath: .status.replicas
      status: {}

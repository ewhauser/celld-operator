---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: celldfleets.celld.example.com
spec:
  group: celld.example.com
  names:
    kind: CelldFleet
    listKind: CelldFleetList
    plural: celldfleets
    shortNames:
    - cf
    singular: celldfleet
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CelldFleet is initial provisioning only. No scale subresource
          is exposed.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              placement:
                properties:
                  azCount:
                    format: int32
                    maximum: 6
                    minimum: 1
                    type: integer
                  mode:
                    default: Strict
                    description: Relaxed keeps the zone allowlist but changes spread
                      to ScheduleAnyway.
                    enum:
                    - Strict
                    - Relaxed
                    type: string
                  zones:
                    description: Explicit zone allowlist; no automatic reselection
                      when capacity changes.
                    items:
                      maxLength: 33
                      minLength: 1
                      type: string
                    maxItems: 6
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                required:
                - azCount
                - zones
                type: object
              profile:
                enum:
                - Bucket
                - PersistentFleet
                type: string
              qualification:
                description: A required acknowledgment of the qualification boundary;
                  production is unavailable.
                enum:
                - Experimental
                type: string
              replicas:
                default: 3
                format: int32
                maximum: 100
                minimum: 1
                type: integer
              serviceAccountName:
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                type: string
              storage:
                description: |-
                  One entire bucket is reserved, including all runtime metadata and peer keys.
                  Prefix multiplexing and alternate S3 authorities are deliberately unsupported.
                properties:
                  bucket:
                    maxLength: 63
                    minLength: 3
                    pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
                    type: string
                  region:
                    maxLength: 32
                    pattern: ^[a-z]{2}(-[a-z]+)+-[0-9]+$
                    type: string
                  sizeGiB:
                    default: 10
                    description: 'Disk space in GiB: PVC size for PersistentFleet,
                      disk-backed emptyDir limit for Bucket.'
                    format: int32
                    maximum: 16384
                    minimum: 1
                    type: integer
                  storageClassName:
                    description: Required only for PersistentFleet; must reference
                      an existing Retain/WaitForFirstConsumer class.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                    type: string
                required:
                - bucket
                - region
                type: object
            required:
            - placement
            - profile
            - qualification
            - serviceAccountName
            - storage
            type: object
            x-kubernetes-validations:
            - message: spec is immutable until the lifecycle gate is implemented
              rule: self == oldSelf
            - message: azCount must equal the zones count
              rule: self.placement.azCount == size(self.placement.zones)
            - message: replicas must be at least azCount
              rule: self.replicas >= self.placement.azCount
            - message: storageClassName is required only for PersistentFleet
              rule: 'self.profile == ''PersistentFleet'' ? has(self.storage.storageClassName)
                && size(self.storage.storageClassName) > 0 : !has(self.storage.storageClassName)'
            - message: zones must be standard AZ names in storage.region
              rule: self.placement.zones.all(z, z.startsWith(self.storage.region)
                && size(z) == size(self.storage.region) + 1 && z.matches('.*[a-z]$'))
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              readyReplicas:
                format: int32
                type: integer
              reservation:
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: fleet name must be a DNS label of at most 40 characters
          rule: size(self.metadata.name) <= 40 && self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    served: true
    storage: true
    subresources:
      status: {}

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: celldfleets.celld.example.com
spec:
  group: celld.example.com
  names:
    kind: CelldFleet
    listKind: CelldFleetList
    plural: celldfleets
    shortNames:
    - cf
    singular: celldfleet
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CelldFleet supports journaled capacity and maintenance requests.
          No scale subresource is exposed.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              bucketWorkload:
                default: Deployment
                description: Immutable Bucket controller layout. Ordered enables deterministic
                  ordinal removal.
                enum:
                - Deployment
                - Ordered
                type: string
              capacity:
                description: Optional policy; omission keeps manual ownership.
                properties:
                  cpuHighMillicores:
                    default: 200
                    format: int32
                    maximum: 1000000
                    minimum: 1
                    type: integer
                  cpuLowMillicores:
                    default: 80
                    format: int32
                    maximum: 1000000
                    minimum: 1
                    type: integer
                  maxAgeSeconds:
                    default: 45
                    format: int32
                    maximum: 600
                    minimum: 10
                    type: integer
                  maxReplicas:
                    default: 10
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  maxWindowSeconds:
                    default: 60
                    format: int32
                    maximum: 300
                    minimum: 5
                    type: integer
                  memoryHighMiB:
                    default: 768
                    format: int32
                    maximum: 1048576
                    minimum: 1
                    type: integer
                  memoryLowMiB:
                    default: 384
                    format: int32
                    maximum: 1048576
                    minimum: 1
                    type: integer
                  minReplicas:
                    default: 3
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  minSamples:
                    default: 3
                    format: int32
                    maximum: 100
                    minimum: 2
                    type: integer
                  minWindowSeconds:
                    default: 5
                    format: int32
                    maximum: 60
                    minimum: 1
                    type: integer
                  mode:
                    default: Shadow
                    enum:
                    - Shadow
                    - ScaleOut
                    - Automatic
                    type: string
                  provisioningTimeoutSeconds:
                    default: 600
                    format: int32
                    maximum: 86400
                    minimum: 60
                    type: integer
                  redistributionObservationSeconds:
                    default: 120
                    description: Continuous complete observation after an addition
                      before judging redistribution.
                    format: int32
                    maximum: 3600
                    minimum: 30
                    type: integer
                  sampleIntervalSeconds:
                    default: 15
                    format: int32
                    maximum: 300
                    minimum: 5
                    type: integer
                  scaleInCooldownSeconds:
                    default: 900
                    format: int32
                    maximum: 86400
                    minimum: 60
                    type: integer
                  scaleInStabilizationSeconds:
                    default: 600
                    format: int32
                    maximum: 86400
                    minimum: 60
                    type: integer
                  scaleOutCooldownSeconds:
                    default: 300
                    format: int32
                    maximum: 86400
                    minimum: 30
                    type: integer
                  scaleOutStabilizationSeconds:
                    default: 30
                    format: int32
                    maximum: 3600
                    minimum: 10
                    type: integer
                  scaleOutStep:
                    default: 1
                    format: int32
                    maximum: 10
                    minimum: 1
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: invalid replica bounds
                  rule: self.minReplicas <= self.maxReplicas
                - message: low thresholds must be below high thresholds
                  rule: self.cpuLowMillicores < self.cpuHighMillicores && self.memoryLowMiB
                    < self.memoryHighMiB
                - message: invalid sampling windows
                  rule: self.minWindowSeconds <= self.maxWindowSeconds && self.sampleIntervalSeconds
                    <= self.maxAgeSeconds
              execution:
                description: |-
                  Per-fleet runtime sizing. Immutable after creation: the operator never rolls
                  out a changed pod template. Omitted fields keep the prototype constants.
                properties:
                  cpuLimit:
                    description: 'CPU limit for the celld container. Default: none.'
                    pattern: ^[0-9]+(\.[0-9]+)?m?$
                    type: string
                  cpuRequest:
                    description: CPU request for the celld container (Kubernetes quantity).
                      Default 250m.
                    pattern: ^[0-9]+(\.[0-9]+)?m?$
                    type: string
                  idleEvictSeconds:
                    description: |-
                      Seconds after which an idle resident cell hibernates (CELLD_IDLE_EVICT_S).
                      Unset leaves only pressure and the residency cap to evict idle cells.
                    format: int32
                    maximum: 86400
                    minimum: 1
                    type: integer
                  maxResidentCells:
                    description: |-
                      Hard resident-cell admission limit (CELLD_MAX_RESIDENT_CELLS). Unset leaves
                      the runtime default.
                    format: int32
                    maximum: 1000000
                    minimum: 1
                    type: integer
                  memoryLimit:
                    description: Memory limit for the celld container. Default 1Gi.
                    pattern: ^[0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|K|M|G|T)?$
                    type: string
                  memoryRequest:
                    description: Memory request for the celld container. Default 512Mi.
                    pattern: ^[0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|K|M|G|T)?$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: cpuLimit must be at least cpuRequest
                  rule: '!has(self.cpuLimit) || !has(self.cpuRequest) || quantity(self.cpuLimit).isGreaterThan(quantity(self.cpuRequest))
                    || quantity(self.cpuLimit).compareTo(quantity(self.cpuRequest))
                    == 0'
                - message: memoryLimit must be at least memoryRequest
                  rule: '!has(self.memoryLimit) || !has(self.memoryRequest) || quantity(self.memoryLimit).isGreaterThan(quantity(self.memoryRequest))
                    || quantity(self.memoryLimit).compareTo(quantity(self.memoryRequest))
                    == 0'
              lifecycle:
                description: Per-fleet shutdown and termination budgets. Immutable
                  after creation.
                properties:
                  shutdownSeconds:
                    description: celld total stop bound in seconds (CELLD_SHUTDOWN_TOTAL_MS).
                      Default 20.
                    format: int32
                    maximum: 3600
                    minimum: 1
                    type: integer
                  terminationGraceSeconds:
                    description: Pod terminationGracePeriodSeconds. Default 30. Must
                      exceed shutdownSeconds by 5.
                    format: int32
                    maximum: 3605
                    minimum: 6
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: terminationGraceSeconds must exceed shutdownSeconds by
                    at least 5
                  rule: '!has(self.shutdownSeconds) || !has(self.terminationGraceSeconds)
                    || self.shutdownSeconds + 5 <= self.terminationGraceSeconds'
                - message: shutdownSeconds above 25 requires an explicit terminationGraceSeconds
                  rule: '!has(self.shutdownSeconds) || has(self.terminationGraceSeconds)
                    || self.shutdownSeconds + 5 <= 30'
                - message: terminationGraceSeconds must be at least 25 with the default
                    20 second shutdown
                  rule: has(self.shutdownSeconds) || !has(self.terminationGraceSeconds)
                    || self.terminationGraceSeconds >= 25
              maintenance:
                description: Maintenance requests share the retained lifecycle journal.
                properties:
                  allowCoordinatedDowntime:
                    description: Explicitly permit an operation that stops the entire
                      fleet.
                    type: boolean
                  orderedMigrationToken:
                    description: 'Request one-way Deployment-to-Ordered migration
                      together with bucketWorkload: Ordered.'
                    maxLength: 128
                    type: string
                  paused:
                    description: Pause new actions and unissued operations; continue
                      recovery of issued actions.
                    type: boolean
                  restartToken:
                    description: Change this token to request a planned restart. No
                      restart is qualified yet.
                    maxLength: 128
                    type: string
                type: object
              placement:
                properties:
                  azCount:
                    format: int32
                    maximum: 6
                    minimum: 1
                    type: integer
                  mode:
                    default: Strict
                    description: Relaxed keeps the zone allowlist but changes spread
                      to ScheduleAnyway.
                    enum:
                    - Strict
                    - Relaxed
                    type: string
                  zones:
                    description: Explicit zone allowlist; no automatic reselection
                      when capacity changes.
                    items:
                      maxLength: 33
                      minLength: 1
                      type: string
                    maxItems: 6
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                required:
                - azCount
                - zones
                type: object
              profile:
                enum:
                - Bucket
                - PersistentFleet
                type: string
              qualification:
                description: A required acknowledgment of the qualification boundary;
                  production is unavailable.
                enum:
                - Experimental
                type: string
              replicas:
                default: 3
                format: int32
                maximum: 100
                minimum: 1
                type: integer
              runtimeImage:
                description: |-
                  Requested immutable runtime digest. Omission selects the original v0.5.0 pin.
                  Unsupported transitions are durably blocked, including rollback.
                pattern: ^ghcr.io/denoland/celld@sha256:[a-f0-9]{64}$
                type: string
              serviceAccountName:
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                type: string
              storage:
                description: |-
                  One entire bucket is reserved, including all runtime metadata and peer keys.
                  Prefix multiplexing and alternate S3 authorities are deliberately unsupported.
                properties:
                  bucket:
                    maxLength: 63
                    minLength: 3
                    pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
                    type: string
                  region:
                    maxLength: 32
                    pattern: ^[a-z]{2}(-[a-z]+)+-[0-9]+$
                    type: string
                  sizeGiB:
                    default: 10
                    description: 'Disk space in GiB: PVC size for PersistentFleet,
                      disk-backed emptyDir limit for Bucket.'
                    format: int32
                    maximum: 16384
                    minimum: 1
                    type: integer
                  storageClassName:
                    description: Required only for PersistentFleet; must reference
                      an existing Retain/WaitForFirstConsumer class.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                    type: string
                required:
                - bucket
                - region
                type: object
            required:
            - placement
            - profile
            - qualification
            - serviceAccountName
            - storage
            type: object
            x-kubernetes-validations:
            - message: only replicas, capacity, runtimeImage, maintenance and an authorized
                Deployment-to-Ordered migration may change; execution and lifecycle
                tuning are fixed at creation
              rule: self.qualification == oldSelf.qualification && self.profile ==
                oldSelf.profile && self.serviceAccountName == oldSelf.serviceAccountName
                && self.storage == oldSelf.storage && self.placement == oldSelf.placement
                && has(self.execution) == has(oldSelf.execution) && (!has(self.execution)
                || self.execution == oldSelf.execution) && has(self.lifecycle) ==
                has(oldSelf.lifecycle) && (!has(self.lifecycle) || self.lifecycle
                == oldSelf.lifecycle) && (self.bucketWorkload == oldSelf.bucketWorkload
                || (oldSelf.bucketWorkload == 'Deployment' && self.bucketWorkload
                == 'Ordered' && has(self.maintenance) && has(self.maintenance.orderedMigrationToken)
                && size(self.maintenance.orderedMigrationToken) > 0 && has(self.maintenance.allowCoordinatedDowntime)
                && self.maintenance.allowCoordinatedDowntime))
            - message: Ordered bucketWorkload requires Bucket profile
              rule: self.bucketWorkload != 'Ordered' || self.profile == 'Bucket'
            - message: azCount must equal the zones count
              rule: self.placement.azCount == size(self.placement.zones)
            - message: replicas must be at least azCount
              rule: self.replicas >= self.placement.azCount
            - message: storageClassName is required only for PersistentFleet
              rule: 'self.profile == ''PersistentFleet'' ? has(self.storage.storageClassName)
                && size(self.storage.storageClassName) > 0 : !has(self.storage.storageClassName)'
            - message: zones must be standard AZ names in storage.region
              rule: self.placement.zones.all(z, z.startsWith(self.storage.region)
                && size(z) == size(self.storage.region) + 1 && z.matches('.*[a-z]$'))
            - message: capacity minimum must cover requested AZs
              rule: '!has(self.capacity) || self.capacity.minReplicas >= self.placement.azCount'
          status:
            properties:
              appliedReplicas:
                format: int32
                type: integer
              blockedSince:
                type: string
              capacity:
                properties:
                  coveredReplicas:
                    format: int32
                    type: integer
                  desiredReplicas:
                    format: int32
                    type: integer
                  message:
                    type: string
                  mode:
                    type: string
                  pendingReplicas:
                    format: int32
                    type: integer
                  reason:
                    type: string
                  usefulReplicas:
                    format: int32
                    type: integer
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              desiredReplicas:
                format: int32
                type: integer
              joiningReplicas:
                format: int32
                type: integer
              lifecycle:
                description: |-
                  LifecycleStatus is an informational projection of the retained reservation journal.
                  Clearing status never cancels an operation or removes recovery evidence.
                properties:
                  deadline:
                    type: string
                  evidenceBlocker:
                    type: string
                  evidenceCheckedAt:
                    type: string
                  from:
                    format: int32
                    type: integer
                  lastCompletionAt:
                    type: string
                  lastOutcome:
                    type: string
                  operationID:
                    type: string
                  phase:
                    type: string
                  possibleLoss:
                    type: string
                  requestID:
                    type: string
                  requestKind:
                    type: string
                  retiredBucketSessions:
                    description: RetiredBucketSessions left logical membership; physical
                      liveness is unknown.
                    format: int32
                    type: integer
                  sessionCount:
                    format: int32
                    type: integer
                  stalled:
                    type: boolean
                  startedAt:
                    type: string
                  targetGeneration:
                    type: string
                  targetImage:
                    type: string
                  targetPod:
                    type: string
                  targetUID:
                    type: string
                  to:
                    format: int32
                    type: integer
                type: object
              observedGeneration:
                format: int64
                type: integer
              observedReplicas:
                format: int32
                type: integer
              readyReplicas:
                format: int32
                type: integer
              replicaObservationValid:
                type: boolean
              reservation:
                type: string
              terminatingReplicas:
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: fleet name must be a DNS label of at most 40 characters
          rule: size(self.metadata.name) <= 40 && self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    served: true
    storage: true
    subresources:
      status: {}

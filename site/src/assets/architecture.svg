<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" role="img" aria-labelledby="title description">
  <title id="title">How an application, the operator, and storage connect</title>
  <desc id="description">An application client sends requests through the port 8080 Service to celld pods. A CelldFleet manifest tells the operator to create and maintain those pods. The pods store data in S3 and, for PersistentFleet, retained EBS volumes. The operator reads recovery metadata from S3 and saves operation records in Kubernetes.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#37684f"/></marker></defs>
  <rect width="880" height="490" rx="16" fill="#f6f7f2"/>
  <g font-family="system-ui, sans-serif" fill="#20382d" text-anchor="middle">
    <g fill="#eaf3ec" stroke="#a4aea3" stroke-width="1.5">
      <rect x="30" y="52" width="170" height="70" rx="9"/><rect x="310" y="52" width="220" height="70" rx="9"/>
      <rect x="630" y="52" width="220" height="70" rx="9"/><rect x="30" y="225" width="170" height="70" rx="9"/>
      <rect x="310" y="225" width="220" height="70" rx="9"/><rect x="630" y="225" width="220" height="70" rx="9"/>
      <rect x="310" y="392" width="220" height="70" rx="9"/><rect x="630" y="392" width="220" height="70" rx="9"/>
    </g>
    <g font-size="19" font-weight="600">
      <text x="115" y="82">Your manifest</text><text x="420" y="82">celld operator</text><text x="740" y="82">Operation records</text>
      <text x="115" y="255">Your client</text><text x="420" y="255">Application Service</text><text x="740" y="255">celld pods</text>
      <text x="420" y="422">Dedicated S3 bucket</text><text x="740" y="422">Retained EBS disks</text>
    </g>
    <g font-size="14">
      <text x="115" y="104">CelldFleet</text><text x="420" y="104">Kubernetes controller</text><text x="740" y="104">Reservation + journal</text>
      <text x="115" y="277">In-cluster or ingress</text><text x="420" y="277">Port 8080</text><text x="740" y="277">Application + durable cells</text>
      <text x="420" y="445">Both profiles</text><text x="740" y="445">PersistentFleet only</text>
    </g>
    <g stroke="#37684f" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M200 87 H310"/><path d="M530 87 H630"/>
      <path d="M200 260 H310"/><path d="M530 260 H630"/>
      <path d="M480 122 V163 H690 V225"/>
      <path d="M690 295 V345 H480 V392"/><path d="M770 295 V392"/>
      <path d="M340 392 V320 H265 V163 H360 V122" stroke-dasharray="5 5"/>
    </g>
    <g font-size="13">
      <text x="255" y="74">desired state</text><text x="580" y="74">save</text>
      <text x="255" y="247">requests</text><text x="580" y="247">requests</text>
      <text x="575" y="151">create and maintain</text><text x="570" y="365">data reads and writes</text>
      <text x="797" y="345">disk I/O</text><text x="180" y="345">read metadata only</text>
    </g>
  </g>
</svg>
